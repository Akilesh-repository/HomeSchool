<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Inner Glow for App Icon Depth -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Gold Sprout & Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Sparkle Radial Flare -->
    <radialGradient id="sparkleFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#451A03" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gradient & Inner Glow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#innerGlow)"/>
  
  <!-- Subtle Glass Highlight Border -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4"/>

  <!-- Center Graphic Group with Shadow -->
  <g filter="url(#iconShadow)">
    
    <!-- Central Flare Glow behind Book Spine -->
    <circle cx="256" cy="245" r="70" fill="url(#sparkleFlare)"/>

    <!-- Outer Book Cover Base Layers -->
    <!-- Left Cover Flap -->
    <path d="M 108 238 C 108 226 116 220 126 220 L 140 220 C 146 220 152 225 152 232 L 152 342 C 152 355 142 364 128 364 C 117 364 108 354 108 342 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Right Cover Flap -->
    <path d="M 404 238 C 404 226 396 220 386 220 L 372 220 C 366 220 360 225 360 232 L 360 342 C 360 355 370 364 384 364 C 395 364 404 354 404 342 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Bottom Book Spine & Outline Frame -->
    <path d="M 124 350 C 150 350 200 355 256 376 C 312 355 362 350 388 350" 
          fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M 256 376 C 256 384 250 390 242 390 C 238 390 234 387 232 384" 
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M 256 376 C 256 384 262 390 270 390 C 274 390 278 387 280 384" 
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Book Page (Solid Fill + Border) -->
    <path d="M 248 352 C 196 332 152 334 142 336 L 142 208 C 156 205 198 203 248 226 Z" 
          fill="url(#pageGradLeft)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

    <!-- Right Book Page (Solid Fill + Border) -->
    <path d="M 264 352 C 316 332 360 334 370 336 L 370 208 C 356 205 314 203 264 226 Z" 
          fill="url(#pageGradRight)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

    <!-- Page Layer Lines (Depth Detail) -->
    <path d="M 152 322 C 176 317 212 320 246 336" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <path d="M 360 322 C 336 317 300 320 266 336" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>

    <!-- Central Centerfold Crease -->
    <line x1="256" y1="230" x2="256" y2="366" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>

    <!-- Sprouting Stem from the Book Center -->
    <path d="M 256 250 Q 256 195 256 155" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Sprout Leaf -->
    <path d="M 254 185 C 230 182 204 158 214 135 C 230 114 256 142 255 175 Z" 
          fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Right Sprout Leaf (Bigger, Arching Higher) -->
    <path d="M 258 165 C 275 140 315 110 324 136 C 330 162 292 182 258 178 Z" 
          fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Brilliant Glowing Four-Point Knowledge Star -->
    <path d="M 256 202 
             C 257 218 266 227 282 228 
             C 266 229 257 238 256 254 
             C 255 238 246 229 230 228 
             C 246 227 255 218 256 202 Z" 
          fill="#FFFFFF" stroke="#FDE68A" stroke-width="4" stroke-linejoin="round"/>
          
    <circle cx="256" cy="228" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
